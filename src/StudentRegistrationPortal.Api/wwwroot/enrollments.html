<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - My Enrollments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100 py-4">

<div class="container" style="max-width: 980px;">
    <div id="alertBox" class="alert d-none mb-3" role="alert"></div>

    <div class="card shadow-sm border-0 p-4 rounded-3">
        <!-- Navigation Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 border-bottom pb-3 gap-2">
            <div>
                <span class="badge bg-primary text-uppercase me-1">Student</span>
                <h4 class="mb-0 d-inline align-middle fw-bold">Welcome, <span id="userName" class="text-primary">Loading...</span></h4>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-primary btn-sm">Dashboard</a>
                <a href="add-courses.html" class="btn btn-outline-primary btn-sm">Add New Courses</a>
                <a href="enrollments.html" class="btn btn-primary btn-sm active">My Enrollments</a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log Out</button>
            </div>
        </div>

        <!-- Student Profile Summary -->
        <div class="card mb-4 bg-light border-0">
            <div class="card-body py-2 small">
                <div class="row g-2">
                    <div class="col-md-3 col-6"><strong>Student ID:</strong> <span id="profileStudentId">-</span></div>
                    <div class="col-md-3 col-6"><strong>Number:</strong> <span id="profileStudentNumber">-</span></div>
                    <div class="col-md-3 col-6"><strong>Department:</strong> <span id="profileDept">-</span></div>
                    <div class="col-md-3 col-6"><strong>Status:</strong> <span id="profileStatus" class="badge bg-success">Active</span></div>
                </div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="card border-0 bg-light mb-4 p-3">
            <h6 class="fw-bold text-secondary mb-2">Search & Filters</h6>
            <div class="row g-2 align-items-end">
                <div class="col-md-3 col-6">
                    <label class="form-label small mb-1">Start Date</label>
                    <input type="date" id="startDate" class="form-control form-control-sm">
                </div>
                <div class="col-md-3 col-6">
                    <label class="form-label small mb-1">End Date</label>
                    <input type="date" id="endDate" class="form-control form-control-sm">
                </div>
                <div class="col-md-3 col-6">
                    <label class="form-label small mb-1">Status</label>
                    <select id="statusFilter" class="form-select form-select-sm">
                        <option value="">All Statuses</option>
                        <option value="Pending">Pending</option>
                        <option value="Registered">Registered</option>
                        <option value="Withdrawn">Withdrawn</option>
                    </select>
                </div>
                <div class="col-md-3 col-6">
                    <label class="form-label small mb-1">Keyword</label>
                    <input type="text" id="searchTerm" class="form-control form-control-sm" placeholder="Search...">
                </div>
            </div>
        </div>

        <!-- Enrollments Table -->
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">My Registered & Pending Enrollments</h5>
                <span id="badgeCount" class="badge bg-secondary">0 found</span>
            </div>
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Course Code</th>
                            <th>Course Title</th>
                            <th>Status</th>
                            <th>Date Submitted</th>
                        </tr>
                    </thead>
                    <tbody id="enrollmentsBody">
                        <tr><td colspan="5" class="text-center text-muted py-4">Loading enrollments...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API = '/api/students';

    async function api(url, opts = {}) {
        opts.headers = opts.headers || {};
        opts.headers['X-Api-Version'] = '1.0';
        opts.headers['Content-Type'] = 'application/json';
        const token = localStorage.getItem('jwt_token') || localStorage.getItem('admin_jwt_token');
        if (token) opts.headers['Authorization'] = `Bearer ${token}`;
        const res = await fetch(url, opts);
        const data = await res.json().catch(() => null);
        if (!res.ok) throw new Error(data?.message || `Error ${res.status}`);
        return data;
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('jwt_token') || localStorage.getItem('admin_jwt_token');
        if (!token) return window.location.replace('login.html');
        try {
            const s = await api(`${API}/me`);
            document.getElementById('userName').textContent = `${s.firstName || ''} ${s.lastName || ''}`.trim();
            document.getElementById('profileStudentId').textContent = s.studentId || '-';
            document.getElementById('profileStudentNumber').textContent = s.studentNumber || '-';
            document.getElementById('profileDept').textContent = s.departmentName || '-';
            loadEnrollments();
        } catch (e) {
            localStorage.clear();
            window.location.replace('login.html');
        }
    });

    async function loadEnrollments() {
        const params = new URLSearchParams();
        ['startDate', 'endDate', 'statusFilter', 'searchTerm'].forEach(id => {
            const v = document.getElementById(id)?.value?.trim();
            if (v) params.append(id === 'statusFilter' ? 'status' : id === 'searchTerm' ? 'searchTerm' : id, v);
        });

        try {
            const list = await api(`${API}/me/enrollments?${params.toString()}`) || [];
            document.getElementById('badgeCount').textContent = `${list.length} found`;
            const tbody = document.getElementById('enrollmentsBody');
            tbody.innerHTML = list.length === 0 ? '<tr><td colspan="5" class="text-center text-muted py-3">No enrollments found.</td></tr>' : '';

            list.forEach(e => {
                const st = (e.status || e.statusName || 'Pending').trim();
                const stL = st.toLowerCase();
                let bClass = 'bg-secondary';
                if (stL === 'pending') bClass = 'bg-warning text-dark';
                else if (['registered', 'enrolled', 'approved', 'active'].includes(stL)) bClass = 'bg-success';
                else if (['withdrawn', 'dropped'].includes(stL)) bClass = 'bg-danger';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="fw-bold text-muted">#${e.enrollmentId}</td>
                    <td><span class="badge bg-primary">${e.courseCode || '-'}</span></td>
                    <td class="fw-semibold">${e.courseName || e.courseTitle || '-'}</td>
                    <td><span class="badge ${bClass}">${st}</span></td>
                    <td class="small text-muted">${e.registrationDate ? new Date(e.registrationDate).toLocaleDateString() : '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            document.getElementById('enrollmentsBody').innerHTML = `<tr><td colspan="5" class="text-danger text-center py-3">${err.message}</td></tr>`;
        }
    }

    ['startDate', 'endDate', 'statusFilter', 'searchTerm'].forEach(id => {
        document.getElementById(id).addEventListener('change', loadEnrollments);
        if (id === 'searchTerm') document.getElementById(id).addEventListener('input', loadEnrollments);
    });

    document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.clear(); window.location.replace('login.html'); });
</script>

</body>
</html>
