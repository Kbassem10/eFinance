<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - My Enrollments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
        .dashboard-card { max-width: 980px; width: 100%; margin: 40px auto; border-radius: 12px; }
        .stat-card { border-radius: 10px; border: 1px solid rgba(0,0,0,0.08); transition: transform 0.15s ease-in-out; }
        .stat-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="container my-4">
    <div id="alertBox" class="alert d-none mx-auto mb-3" style="max-width: 980px;" role="alert"></div>

    <!-- Authenticated Enrollments Dashboard Card -->
    <div id="dashboardSection" class="card shadow-sm dashboard-card p-4">
        <!-- Header Navigation Bar -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 border-bottom pb-3 gap-2">
            <div>
                <span class="badge bg-primary text-uppercase me-1">Student</span>
                <h4 class="mb-0 d-inline align-middle fw-bold">Welcome, <span id="userName" class="text-primary">Loading...</span></h4>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="index.html" class="btn btn-outline-primary btn-sm">Course Registration</a>
                <a href="enrollments.html" class="btn btn-primary btn-sm active">My Enrollments</a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log Out</button>
            </div>
        </div>

        <!-- Student Profile Summary -->
        <div class="card mb-4 bg-light border-0">
            <div class="card-body py-3">
                <div class="row g-2 small">
                    <div class="col-md-3 col-6"><strong>Student ID:</strong> <span id="profileStudentId">-</span></div>
                    <div class="col-md-3 col-6"><strong>Number:</strong> <span id="profileStudentNumber">-</span></div>
                    <div class="col-md-3 col-6"><strong>Department:</strong> <span id="profileDept">-</span></div>
                    <div class="col-md-3 col-6"><strong>Status:</strong> <span id="profileStatus" class="badge bg-success">Active</span></div>
                </div>
            </div>


        <!-- Filter & Search Section -->
        <div class="card shadow-sm mb-4 border-0 bg-light">
            <div class="card-body p-3">
                <h6 class="fw-bold text-secondary mb-3">Search & Date Filters</h6>
                <div class="row g-3 align-items-end">
                    <div class="col-lg-3 col-md-6">
                        <label for="startDateFilter" class="form-label small fw-semibold mb-1">Start Date:</label>
                        <input type="date" id="startDateFilter" class="form-control form-control-sm">
                    </div>
                    <div class="col-lg-3 col-md-6">
                        <label for="endDateFilter" class="form-label small fw-semibold mb-1">End Date:</label>
                        <input type="date" id="endDateFilter" class="form-control form-control-sm">
                    </div>
                    <div class="col-lg-3 col-md-6">
                        <label for="statusFilter" class="form-label small fw-semibold mb-1">Status:</label>
                        <select id="statusFilter" class="form-select form-select-sm">
                            <option value="">All Statuses</option>
                            <option value="Pending">Pending</option>
                            <option value="Enrolled">Enrolled / Confirmed</option>
                            <option value="Completed">Completed</option>
                            <option value="Dropped">Dropped</option>
                        </select>
                    </div>
                    <div class="col-lg-3 col-md-6">
                        <label for="textSearchFilter" class="form-label small fw-semibold mb-1">Keyword Search:</label>
                        <input type="text" id="textSearchFilter" class="form-control form-control-sm" placeholder="Code, Name, or ID...">
                    </div>
                </div>

                <!-- Quick Presets & Action Buttons -->
                <div class="d-flex flex-wrap justify-content-between align-items-center mt-3 pt-2 border-top gap-2">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Date Range Presets">
                        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('all')">All Time</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('today')">Today</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('7days')">Last 7 Days</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('30days')">Last 30 Days</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="setDatePreset('thisYear')">This Year</button>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="resetFiltersBtn" class="btn btn-sm btn-outline-secondary">Reset Filters</button>
                        <button id="applyFiltersBtn" class="btn btn-sm btn-primary px-3">Apply Filters</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Enrolled / Submitted Courses List -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white fw-bold d-flex justify-content-between align-items-center py-3">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="mb-0 fw-bold">My Registered & Pending Enrollments</h5>
                    <span id="resultsCountBadge" class="badge bg-secondary">0 found</span>
                </div>
                <button id="refreshEnrollmentsBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Enrollment ID</th>
                                <th>Course Code</th>
                                <th>Course Name</th>
                                <th>Status</th>
                                <th>Registration Date</th>
                            </tr>
                        </thead>
                        <tbody id="enrolledCoursesTableBody">
                            <tr><td colspan="5" class="text-center text-muted py-4">Loading enrollments...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = '/api/students';
    const API_VERSION = '1.0';

    let allEnrollments = [];

    async function apiRequest(url, options = {}) {
        options.headers = options.headers || {};
        options.headers['X-Api-Version'] = API_VERSION;
        options.headers['Content-Type'] = 'application/json';

        const token = localStorage.getItem('jwt_token');
        if (token) {
            options.headers['Authorization'] = `Bearer ${token}`;
        }

        const response = await fetch(url, options);
        const data = await response.json().catch(() => null);

        if (!response.ok) {
            const errorMsg = data?.message || data?.detail || `Error (${response.status}): ${response.statusText}`;
            throw new Error(errorMsg);
        }
        return data;
    }

    function showAlert(message, type = 'danger') {
        const alertBox = document.getElementById('alertBox');
        if (!alertBox) return;
        alertBox.className = `alert alert-${type} mx-auto mb-3`;
        alertBox.innerHTML = message;
        alertBox.classList.remove('d-none');
    }

    function hideAlert() {
        const alertBox = document.getElementById('alertBox');
        if (alertBox) alertBox.classList.add('d-none');
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            window.location.replace('login.html');
            return;
        }

        try {
            const student = await apiRequest(`${API_BASE}/me`, { method: 'GET' });
            displayProfile(student);
            await loadMyEnrollments();
        } catch (err) {
            logout();
        }
    });

    function displayProfile(student) {
        if (!student) return;
        const userEl = document.getElementById('userName');
        if (userEl) userEl.textContent = `${student.firstName || ''} ${student.lastName || ''}`.trim() || 'Student';
        const idEl = document.getElementById('profileStudentId');
        if (idEl) idEl.textContent = student.studentId || '-';
        const numEl = document.getElementById('profileStudentNumber');
        if (numEl) numEl.textContent = student.studentNumber || '-';
        const deptEl = document.getElementById('profileDept');
        if (deptEl) deptEl.textContent = student.departmentName || (student.departmentId ? `Dept #${student.departmentId}` : '-');
        const statusEl = document.getElementById('profileStatus');
        if (statusEl) statusEl.textContent = student.statusName || 'Active';
    }

    let searchDebounceTimer = null;

    function debounceSearch() {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => {
            loadMyEnrollments();
        }, 300);
    }

    async function loadMyEnrollments() {
        const tbody = document.getElementById('enrolledCoursesTableBody');
        const countBadge = document.getElementById('resultsCountBadge');
        if (tbody) tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">Loading enrollments...</td></tr>`;

        const startInput = document.getElementById('startDateFilter');
        const endInput = document.getElementById('endDateFilter');
        const statusInput = document.getElementById('statusFilter');
        const searchInput = document.getElementById('textSearchFilter');

        const startDateVal = startInput ? startInput.value : '';
        const endDateVal = endInput ? endInput.value : '';
        const statusVal = statusInput ? statusInput.value.trim() : '';
        const searchKeyword = searchInput ? searchInput.value.trim() : '';

        const params = new URLSearchParams();
        if (startDateVal) params.append('startDate', startDateVal);
        if (endDateVal) params.append('endDate', endDateVal);
        if (statusVal) params.append('status', statusVal);
        if (searchKeyword) params.append('searchTerm', searchKeyword);

        const queryString = params.toString();
        const url = `${API_BASE}/me/enrollments${queryString ? `?${queryString}` : ''}`;

        try {
            const list = await apiRequest(url, { method: 'GET' });
            allEnrollments = Array.isArray(list) ? list : [];
            updateMetrics(allEnrollments);
            renderEnrollmentsTable(allEnrollments);
        } catch (err) {
            if (tbody) tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center py-3">${err.message || 'Failed to load enrollments'}</td></tr>`;
            showAlert(`Failed to load enrollments: ${err.message || 'Unknown error'}`, 'danger');
        }
    }

    function updateMetrics(list) {
        if (!Array.isArray(list)) return;
        const total = list.length;
        let pending = 0;
        let confirmed = 0;

        list.forEach(e => {
            const status = (e?.status || '').toLowerCase();
            if (status === 'pending') {
                pending++;
            } else if (status === 'enrolled' || status === 'approved' || status === 'active' || status === 'completed') {
                confirmed++;
            }
        });

        const totalEl = document.getElementById('statTotalEnrollments');
        if (totalEl) totalEl.textContent = total;
        const pendingEl = document.getElementById('statPendingEnrollments');
        if (pendingEl) pendingEl.textContent = pending;
        const confirmedEl = document.getElementById('statConfirmedEnrollments');
        if (confirmedEl) confirmedEl.textContent = confirmed;
    }

    function renderEnrollmentsTable(items) {
        const tbody = document.getElementById('enrolledCoursesTableBody');
        const countBadge = document.getElementById('resultsCountBadge');

        if (countBadge) countBadge.textContent = `${items.length} found`;
        if (!tbody) return;
        tbody.innerHTML = '';

        if (items.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-muted py-4">
                        <div>No enrollment records match your filter criteria.</div>
                        <button class="btn btn-sm btn-link mt-1" onclick="resetFilters()">Clear Filters</button>
                    </td>
                </tr>`;
            return;
        }

        items.forEach(e => {
            const tr = document.createElement('tr');
            const statusLower = (e.status || '').toLowerCase();
            let statusBadge = 'secondary';
            if (statusLower === 'pending') statusBadge = 'warning text-dark';
            else if (statusLower === 'enrolled' || statusLower === 'approved' || statusLower === 'active') statusBadge = 'success';
            else if (statusLower === 'dropped' || statusLower === 'cancelled' || statusLower === 'rejected') statusBadge = 'danger';
            else if (statusLower === 'completed') statusBadge = 'info text-dark';

            const dateStr = e.registrationDate ? new Date(e.registrationDate).toLocaleString() : 'N/A';

            tr.innerHTML = `
                <td class="fw-semibold">#${e.enrollmentId || ''}</td>
                <td><span class="badge bg-primary">${e.courseCode || ''}</span></td>
                <td><strong>${e.courseName || ''}</strong></td>
                <td><span class="badge bg-${statusBadge}">${e.status || 'Active'}</span></td>
                <td>${dateStr}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.setDatePreset = function(preset) {
        const startInput = document.getElementById('startDateFilter');
        const endInput = document.getElementById('endDateFilter');
        const today = new Date();

        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        if (preset === 'all') {
            startInput.value = '';
            endInput.value = '';
        } else if (preset === 'today') {
            const dateStr = formatDate(today);
            startInput.value = dateStr;
            endInput.value = dateStr;
        } else if (preset === '7days') {
            const past = new Date(today);
            past.setDate(today.getDate() - 7);
            startInput.value = formatDate(past);
            endInput.value = formatDate(today);
        } else if (preset === '30days') {
            const past = new Date(today);
            past.setDate(today.getDate() - 30);
            startInput.value = formatDate(past);
            endInput.value = formatDate(today);
        } else if (preset === 'thisYear') {
            const startYear = new Date(today.getFullYear(), 0, 1);
            startInput.value = formatDate(startYear);
            endInput.value = formatDate(today);
        }

        loadMyEnrollments();
    };

    window.resetFilters = function() {
        document.getElementById('startDateFilter').value = '';
        document.getElementById('endDateFilter').value = '';
        document.getElementById('statusFilter').value = '';
        document.getElementById('textSearchFilter').value = '';
        loadMyEnrollments();
    };

    // Server-side search event listeners
    document.getElementById('startDateFilter')?.addEventListener('change', loadMyEnrollments);
    document.getElementById('endDateFilter')?.addEventListener('change', loadMyEnrollments);
    document.getElementById('statusFilter')?.addEventListener('change', loadMyEnrollments);
    document.getElementById('textSearchFilter')?.addEventListener('input', debounceSearch);
    document.getElementById('applyFiltersBtn')?.addEventListener('click', loadMyEnrollments);
    document.getElementById('resetFiltersBtn')?.addEventListener('click', resetFilters);
    document.getElementById('refreshEnrollmentsBtn')?.addEventListener('click', loadMyEnrollments);

    function logout() {
        localStorage.removeItem('jwt_token');
        window.location.replace('login.html');
    }

    document.getElementById('logoutBtn')?.addEventListener('click', logout);
</script>

</body>
</html>
