<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { max-width: 440px; width: 100%; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container p-3">
    <div id="alertBox" class="alert d-none mx-auto mb-3" style="max-width: 440px;" role="alert"></div>

    <div class="card shadow-sm auth-card p-4 mx-auto bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark mb-1">Student Portal</h3>
            <p class="text-muted small mb-0">Sign in with your student credentials</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold small">Email Address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="student@example.edu" required autofocus>
            </div>
            <div class="mb-4">
                <label for="loginPassword" class="form-label fw-semibold small">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" id="signInBtn" class="btn btn-primary w-100 py-2 fw-semibold">
                Sign In
            </button>
        </form>
    </div>
</div>

<script>
    const API_BASE = '/api/students';
    const API_VERSION = '1.0';

    function showAlert(message, type = 'danger') {
        const alertBox = document.getElementById('alertBox');
        if (!alertBox) return;
        alertBox.className = `alert alert-${type} mx-auto mb-3`;
        alertBox.innerHTML = message;
        alertBox.classList.remove('d-none');
    }

    function hideAlert() {
        const alertBox = document.getElementById('alertBox');
        if (alertBox) alertBox.classList.add('d-none');
    }

    window.addEventListener('DOMContentLoaded', () => {
        // Redirect if already logged in
        if (localStorage.getItem('jwt_token')) {
            window.location.replace('index.html');
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const signInBtn = document.getElementById('signInBtn');

        signInBtn.disabled = true;
        signInBtn.textContent = 'Signing in...';

        try {
            const response = await fetch(`${API_BASE}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Api-Version': API_VERSION
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json().catch(() => null);

            if (!response.ok) {
                const errorMsg = data?.message || data?.detail || `Error (${response.status}): ${response.statusText}`;
                throw new Error(errorMsg);
            }

            localStorage.setItem('jwt_token', data.token);
            showAlert('Login successful! Redirecting...', 'success');
            setTimeout(() => {
                window.location.replace('index.html');
            }, 400);
        } catch (err) {
            showAlert(err.message || 'Login failed. Please check your credentials.', 'danger');
        } finally {
            signInBtn.disabled = false;
            signInBtn.textContent = 'Sign In';
        }
    });
</script>

</body>
</html>
