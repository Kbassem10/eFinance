<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Sign In & Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; }
        .auth-card { max-width: 440px; width: 100%; margin: 60px auto; border-radius: 12px; background-color: #1e293b; border: 1px solid #334155; }
        .admin-dashboard { max-width: 1000px; width: 100%; margin: 40px auto; border-radius: 12px; background-color: #1e293b; border: 1px solid #334155; }
        .form-control, .form-select { background-color: #0f172a; border-color: #475569; color: #f8fafc; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #fff; border-color: #3b82f6; box-shadow: none; }
        .table { color: #f8fafc; }
        .modal-content { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; }
        .nav-pills .nav-link { color: #94a3b8; }
        .nav-pills .nav-link.active { background-color: #ef4444; color: #fff; }
    </style>
</head>
<body>

<div class="container my-auto">
    <div id="alertBox" class="alert d-none mx-auto" style="max-width: 500px;" role="alert"></div>

    <!-- Admin Login Card -->
    <div id="authSection" class="card shadow-lg auth-card p-4">
        <div class="text-center mb-4">
            <span class="badge bg-danger mb-2 px-3 py-2 text-uppercase fw-bold">Admin Portal</span>
            <h4 class="fw-bold text-white mb-1">Administrative Access</h4>
            <p class="text-secondary small mb-0">Restricted to users with Role ID: 1 (Admin)</p>
        </div>

        <form id="adminLoginForm">
            <div class="mb-3">
                <label for="adminEmail" class="form-label text-light">Email Address</label>
                <input type="email" class="form-control" id="adminEmail" placeholder="admin@portal.edu" required>
            </div>
            <div class="mb-3">
                <label for="adminPassword" class="form-label text-light">Password</label>
                <input type="password" class="form-control" id="adminPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Sign In as Admin</button>
        </form>
    </div>

    <!-- Admin Dashboard -->
    <div id="dashboardSection" class="card shadow-lg admin-dashboard p-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
            <div>
                <span class="badge bg-danger text-uppercase me-2">Administrator</span>
                <h4 class="mb-0 d-inline align-middle text-white">Portal Dashboard</h4>
            </div>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log Out</button>
        </div>

        <!-- Admin Info Header -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="p-3 rounded bg-dark border border-secondary">
                    <p class="mb-1 text-secondary small">Authenticated Admin Email</p>
                    <h5 id="adminProfileEmail" class="text-info fw-bold mb-0"></h5>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 rounded bg-dark border border-secondary">
                    <p class="mb-1 text-secondary small">Assigned Roles</p>
                    <div id="adminRolesBadges"></div>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills mb-3" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active fw-bold" id="courses-tab" data-bs-toggle="tab" data-bs-target="#coursesPane" type="button" role="tab">Courses Management</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- 1. COURSES TAB -->
            <div class="tab-pane fade show active" id="coursesPane" role="tabpanel">
                <div class="card bg-dark border-secondary">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center">
                        <span class="fw-semibold text-white">Course Catalog & CRUD</span>
                        <div>
                            <button id="refreshCoursesBtn" class="btn btn-sm btn-outline-secondary me-2">Refresh</button>
                            <button id="addCourseBtn" class="btn btn-sm btn-success fw-bold">+ Add Course</button>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Code</th>
                                        <th>Course Name</th>
                                        <th>Credits</th>
                                        <th>Level</th>
                                        <th>Status</th>
                                        <th>Departments</th>
                                        <th class="text-end pe-3">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="coursesTableBody">
                                    <tr><td colspan="8" class="text-center text-secondary py-3">Loading courses...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- ================= COURSE MODAL (ADD / EDIT) ================= -->
<div class="modal fade" id="courseModal" tabindex="-1" aria-labelledby="courseModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title fw-bold" id="courseModalTitle">Add Course</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="courseForm">
                <div class="modal-body">
                    <input type="hidden" id="courseModalId">
                    <div class="mb-3">
                        <label for="courseCode" class="form-label">Course Code *</label>
                        <input type="text" class="form-control" id="courseCode" placeholder="e.g. CS101" required>
                    </div>
                    <div class="mb-3">
                        <label for="courseName" class="form-label">Course Name *</label>
                        <input type="text" class="form-control" id="courseName" placeholder="e.g. Introduction to CS" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label for="creditHours" class="form-label">Credit Hours</label>
                            <input type="number" class="form-control" id="creditHours" value="3" min="1" max="10" required>
                        </div>
                        <div class="col-md-6">
                            <label for="difficultyLevel" class="form-label">Difficulty Level</label>
                            <select class="form-select" id="difficultyLevel">
                                <option value="Beginner">Beginner</option>
                                <option value="Intermediate">Intermediate</option>
                                <option value="Advanced">Advanced</option>
                                <option value="Undergraduate" selected>Undergraduate</option>
                                <option value="Graduate">Graduate</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label for="courseStatusId" class="form-label">Status</label>
                            <select class="form-select" id="courseStatusId">
                                <option value="1" selected>Active</option>
                                <option value="2">Planned</option>
                                <option value="3">Archived</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="departmentId" class="form-label">Department ID</label>
                            <input type="number" class="form-control" id="departmentId" value="1" min="1">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger" id="saveCourseBtn">Save Course</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_VERSION = '1.0';
    let courseModalInstance = null;

    async function apiRequest(url, options = {}) {
        options.headers = options.headers || {};
        options.headers['X-Api-Version'] = API_VERSION;
        options.headers['Content-Type'] = 'application/json';

        const token = localStorage.getItem('admin_jwt_token');
        if (token) {
            options.headers['Authorization'] = `Bearer ${token}`;
        }

        const response = await fetch(url, options);
        const data = await response.json().catch(() => null);

        if (!response.ok) {
            const errorMsg = data?.message || data?.detail || `Error (${response.status}): ${response.statusText}`;
            throw new Error(errorMsg);
        }
        return data;
    }

    function showAlert(message, type = 'danger') {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = `alert alert-${type} mx-auto`;
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
    }

    function hideAlert() {
        document.getElementById('alertBox').classList.add('d-none');
    }

    window.addEventListener('DOMContentLoaded', () => {
        courseModalInstance = new bootstrap.Modal(document.getElementById('courseModal'));
        const token = localStorage.getItem('admin_jwt_token');
        if (token) {
            loadDashboard();
        }
    });

    // 1. Admin Login
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('adminEmail').value.trim();
        const password = document.getElementById('adminPassword').value;

        try {
            const result = await apiRequest('/api/admin/login', {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });

            localStorage.setItem('admin_jwt_token', result.token);
            showAlert('Admin authenticated successfully!', 'success');
            loadDashboard();
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    });

    async function loadDashboard() {
        try {
            const profile = await apiRequest('/api/admin/me', { method: 'GET' });
            displayAdminProfile(profile);
            loadCourses();
            loadUsers();
        } catch (err) {
            logout();
        }
    }

    function displayAdminProfile(admin) {
        document.getElementById('authSection').classList.add('d-none');
        document.getElementById('dashboardSection').classList.remove('d-none');
        document.getElementById('adminProfileEmail').textContent = admin.email;

        const badgesContainer = document.getElementById('adminRolesBadges');
        badgesContainer.innerHTML = '';
        (admin.roles || ['Admin']).forEach(r => {
            const badge = document.createElement('span');
            badge.className = 'badge bg-danger me-1';
            badge.textContent = r;
            badgesContainer.appendChild(badge);
        });
    }

    // 2. Load Courses
    async function loadCourses() {
        const tbody = document.getElementById('coursesTableBody');
        try {
            const courses = await apiRequest('/api/courses', { method: 'GET' });
            tbody.innerHTML = '';
            if (!courses || courses.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-secondary py-3">No courses found.</td></tr>`;
                return;
            }

            courses.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${c.courseId}</td>
                    <td><span class="badge bg-primary">${c.courseCode}</span></td>
                    <td><strong>${c.courseName}</strong></td>
                    <td>${c.creditHours} hrs</td>
                    <td>${c.difficultyLevel}</td>
                    <td><span class="badge bg-${c.courseStatusId === 1 ? 'success' : 'secondary'}">${c.statusName || 'Active'}</span></td>
                    <td class="small text-secondary">${c.assignedDepartments || 'N/A'}</td>
                    <td class="text-end pe-3">
                        <button class="btn btn-sm btn-outline-warning me-1" onclick="openEditCourse(${c.courseId}, '${c.courseCode}', '${c.courseName.replace(/'/g, "\\'")}', ${c.creditHours}, '${c.difficultyLevel}', ${c.courseStatusId})">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteCourse(${c.courseId}, '${c.courseCode}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="8" class="text-danger text-center py-2">${err.message}</td></tr>`;
        }
    }

    // 3. Add & Edit Course Handlers
    document.getElementById('addCourseBtn').addEventListener('click', () => {
        document.getElementById('courseModalTitle').textContent = 'Add Course';
        document.getElementById('courseModalId').value = '';
        document.getElementById('courseCode').value = '';
        document.getElementById('courseCode').disabled = false;
        document.getElementById('courseName').value = '';
        document.getElementById('creditHours').value = '3';
        document.getElementById('difficultyLevel').value = 'Undergraduate';
        document.getElementById('courseStatusId').value = '1';
        document.getElementById('departmentId').value = '1';
        courseModalInstance.show();
    });

    window.openEditCourse = function(id, code, name, credits, level, statusId) {
        document.getElementById('courseModalTitle').textContent = `Edit Course: ${code}`;
        document.getElementById('courseModalId').value = id;
        document.getElementById('courseCode').value = code;
        document.getElementById('courseCode').disabled = true;
        document.getElementById('courseName').value = name;
        document.getElementById('creditHours').value = credits;
        document.getElementById('difficultyLevel').value = level;
        document.getElementById('courseStatusId').value = statusId;
        document.getElementById('departmentId').value = '1';
        courseModalInstance.show();
    };

    document.getElementById('courseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('courseModalId').value;
        const deptId = parseInt(document.getElementById('departmentId').value, 10);
        const deptIds = isNaN(deptId) ? [] : [deptId];

        try {
            if (id) {
                // Update
                const payload = {
                    courseName: document.getElementById('courseName').value.trim(),
                    creditHours: parseInt(document.getElementById('creditHours').value, 10),
                    difficultyLevel: document.getElementById('difficultyLevel').value,
                    courseStatusId: parseInt(document.getElementById('courseStatusId').value, 10),
                    departmentIds: deptIds
                };
                await apiRequest(`/api/courses/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify(payload)
                });
                showAlert('Course updated successfully!', 'success');
            } else {
                // Create
                const payload = {
                    courseCode: document.getElementById('courseCode').value.trim(),
                    courseName: document.getElementById('courseName').value.trim(),
                    creditHours: parseInt(document.getElementById('creditHours').value, 10),
                    difficultyLevel: document.getElementById('difficultyLevel').value,
                    courseStatusId: parseInt(document.getElementById('courseStatusId').value, 10),
                    departmentIds: deptIds
                };
                await apiRequest('/api/courses', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                showAlert('Course added successfully!', 'success');
            }

            courseModalInstance.hide();
            loadCourses();
        } catch (err) {
            alert(`Failed: ${err.message}`);
        }
    });

    // 4. Delete Course
    window.deleteCourse = async function(id, code) {
        if (!confirm(`Are you sure you want to delete course ${code} (ID: ${id})?`)) return;

        try {
            await apiRequest(`/api/courses/${id}`, { method: 'DELETE' });
            showAlert(`Course ${code} deleted successfully.`, 'success');
            loadCourses();
        } catch (err) {
            showAlert(`Failed to delete course: ${err.message}`, 'danger');
        }
    };

    // 5. Load Users
    async function loadUsers() {
        const tbody = document.getElementById('usersTableBody');
        try {
            const users = await apiRequest('/api/admin/users', { method: 'GET' });
            tbody.innerHTML = '';
            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.userId}</td>
                    <td>${u.email}</td>
                    <td>${(u.roles || []).map(r => `<span class="badge bg-secondary me-1">${r}</span>`).join('') || '<span class="text-muted">None</span>'}</td>
                    <td>${u.isActive ? '<span class="badge bg-success">Active</span>' : '<span class="badge bg-danger">Inactive</span>'}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (err) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-danger text-center py-2">${err.message}</td></tr>`;
        }
    }

    function logout() {
        localStorage.removeItem('admin_jwt_token');
        document.getElementById('dashboardSection').classList.add('d-none');
        document.getElementById('authSection').classList.remove('d-none');
        hideAlert();
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('refreshCoursesBtn').addEventListener('click', loadCourses);
    document.getElementById('refreshUsersBtn').addEventListener('click', loadUsers);
</script>

</body>
</html>
