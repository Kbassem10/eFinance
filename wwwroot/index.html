<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
        .auth-card { max-width: 440px; width: 100%; margin: 60px auto; border-radius: 12px; }
        .dashboard-card { max-width: 720px; width: 100%; margin: 40px auto; border-radius: 12px; }
    </style>
</head>
<body>

<div class="container my-auto">
    <div id="alertBox" class="alert d-none mx-auto" style="max-width: 440px;" role="alert"></div>

    <!-- Login Card -->
    <div id="authSection" class="card shadow-sm auth-card p-4">
        <h4 class="text-center mb-1 fw-bold text-dark">Student Portal</h4>
        <p class="text-center text-muted small mb-4">Sign in with your student credentials</p>

        <form id="loginForm">
            <div class="mb-3">
                <label for="loginEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="student@example.edu" required>
            </div>
            <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
        </form>
    </div>

    <!-- Authenticated Dashboard Card -->
    <div id="dashboardSection" class="card shadow-sm dashboard-card p-4 d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0 fw-bold">Welcome, <span id="userName" class="text-primary"></span></h4>
            <button id="logoutBtn" class="btn btn-outline-danger btn-sm">Log Out</button>
        </div>
        <div class="card mb-3">
            <div class="card-header bg-light fw-semibold">Student Profile</div>
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-sm-6"><strong>Student ID:</strong> <span id="profileStudentId"></span></div>
                    <div class="col-sm-6"><strong>Student Number:</strong> <span id="profileStudentNumber"></span></div>
                    <div class="col-sm-6"><strong>Email:</strong> <span id="profileEmail"></span></div>
                    <div class="col-sm-6"><strong>Department:</strong> <span id="profileDept"></span></div>
                    <div class="col-sm-6"><strong>Status:</strong> <span id="profileStatus" class="badge bg-success"></span></div>
                    <div class="col-sm-6"><strong>Academic Level:</strong> <span id="profileAcademicLevel"></span></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = '/api/students';
    const API_VERSION = '1.0';

    async function apiRequest(url, options = {}) {
        options.headers = options.headers || {};
        options.headers['X-Api-Version'] = API_VERSION;
        options.headers['Content-Type'] = 'application/json';

        const token = localStorage.getItem('jwt_token');
        if (token) {
            options.headers['Authorization'] = `Bearer ${token}`;
        }

        const response = await fetch(url, options);
        const data = await response.json().catch(() => null);

        if (!response.ok) {
            const errorMsg = data?.message || data?.detail || `Error (${response.status}): ${response.statusText}`;
            throw new Error(errorMsg);
        }
        return data;
    }

    function showAlert(message, type = 'danger') {
        const alertBox = document.getElementById('alertBox');
        alertBox.className = `alert alert-${type} mx-auto`;
        alertBox.textContent = message;
        alertBox.classList.remove('d-none');
    }

    function hideAlert() {
        document.getElementById('alertBox').classList.add('d-none');
    }

    window.addEventListener('DOMContentLoaded', () => {
        const token = localStorage.getItem('jwt_token');
        if (token) {
            fetchMyProfile();
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        try {
            const result = await apiRequest(`${API_BASE}/login`, {
                method: 'POST',
                body: JSON.stringify({ email, password })
            });

            localStorage.setItem('jwt_token', result.token);
            displayDashboard(result.student);
            showAlert('Login successful!', 'success');
        } catch (err) {
            showAlert(err.message, 'danger');
        }
    });

    async function fetchMyProfile() {
        try {
            const student = await apiRequest(`${API_BASE}/me`, { method: 'GET' });
            displayDashboard(student);
        } catch (err) {
            logout();
        }
    }

    function displayDashboard(student) {
        document.getElementById('authSection').classList.add('d-none');
        document.getElementById('dashboardSection').classList.remove('d-none');

        document.getElementById('userName').textContent = `${student.firstName} ${student.lastName}`;
        document.getElementById('profileStudentId').textContent = student.studentId;
        document.getElementById('profileStudentNumber').textContent = student.studentNumber;
        document.getElementById('profileEmail').textContent = student.email;
        document.getElementById('profileDept').textContent = student.departmentName || `Dept #${student.departmentId}`;
        document.getElementById('profileStatus').textContent = student.statusName || 'Active';
        document.getElementById('profileAcademicLevel').textContent = student.academicLevel ?? 1;
    }

    function logout() {
        localStorage.removeItem('jwt_token');
        document.getElementById('dashboardSection').classList.add('d-none');
        document.getElementById('authSection').classList.remove('d-none');
        hideAlert();
    }

    document.getElementById('logoutBtn').addEventListener('click', logout);
</script>

</body>
</html>
